name: Public extension release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix companion --omit=dev --ignore-scripts
      - name: Bundle Windows runtime
        run: |
          $nodeExecutable = (Get-Command node).Source
          $nodeVersion = (& node --version).Trim()
          Copy-Item -LiteralPath $nodeExecutable -Destination companion/node.exe
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" -OutFile companion/NODE-LICENSE.txt
      - name: Validate and package
        run: |
          $releaseVersion = (Get-Content extension/manifest.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Version tag mismatch' }
          if (Test-Path extension/config.local.js) { throw 'Personal connection must not be published' }
          Compress-Archive -Path extension/* -DestinationPath "assistant-update-$releaseVersion.zip"
      - name: Publish stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = (Get-Content extension/manifest.json | ConvertFrom-Json).version
          $tag = "v$releaseVersion"
          gh release view $tag --repo TO-HU-TIEU/extension *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo TO-HU-TIEU/extension --yes
          }
          gh release create $tag "assistant-update-$releaseVersion.zip" --repo TO-HU-TIEU/extension --title "Assistant $releaseVersion" --notes "Tải assistant-update-$releaseVersion.zip, giải nén và chép đè vào thư mục extension đang dùng, sau đó bấm Reload trong chrome://extensions."
